# Runs on every push and pull request: the web app's type check, unit tests and build, and the API's
# tests. No secrets are used: the web app builds without Firebase values (its offline shape), and the
# API tests use the in-memory store and a fake AI model. The browser tests (npm run test:e2e) take
# about six minutes and are run by hand before a release.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
