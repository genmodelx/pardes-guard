# United Kingdom destination pack. STATUS: draft, verify before launch.
# English-level and salary thresholds change often, so they are deliberately left as manual checks
# until a reviewer copies the current figures from gov.uk.
code: GB
name: United Kingdom
i18n:
  ur:
    name: برطانیہ
kind: destination
languages: [en]
currency: GBP
status: draft
last_verified: null
official_sources:
  - title: GOV.UK visas and immigration
    url: https://www.gov.uk/browse/visas-immigration
official_domains: [gov.uk]
red_flag_visa_types: [visitor, standard visitor, tourist]
labour_rules:
  status: draft
  notes:
    - A Skilled Worker visa needs a job with an employer licensed by the Home Office. Paying a third party for a Certificate of Sponsorship is a known scam.
  sources:
    - title: Skilled Worker visa
      url: https://www.gov.uk/skilled-worker-visa
visa_routes:
  - id: gb-skilled-worker
    name: Skilled Worker visa
    purpose: work
    status: draft
    last_verified: null
    summary: For a job offer from a Home Office licensed sponsor, at the required skill and salary level, with English at the required level.
    sources:
      - title: Skilled Worker visa
        url: https://www.gov.uk/skilled-worker-visa
    steps:
      - order: 1
        title: Job offer from a licensed sponsor
        description: Check the employer is on the official register of licensed sponsors.
        who: employer
        official_url: https://www.gov.uk/skilled-worker-visa
      - order: 2
        title: Certificate of Sponsorship
        description: The employer assigns you a certificate with a reference number.
        who: employer
      - order: 3
        title: Prove your English
        description: Through an approved Secure English Language Test or another accepted way.
        who: worker
        official_url: https://www.gov.uk/skilled-worker-visa/knowledge-of-english
      - order: 4
        title: Apply online and give biometrics
        description: Pay the fee and the healthcare surcharge.
        who: worker
        official_url: https://www.gov.uk/skilled-worker-visa
    documents:
      - Passport
      - Certificate of Sponsorship reference
      - English test result
      - Tuberculosis test result if required for your country
    requirements:
      - id: gb-sw-english
        kind: language_test
        title: English at the required level
        description: The required level is set by UK Visas and Immigration; check the current level on gov.uk before booking a test.
        status: draft
        sources:
          - title: Knowledge of English
            url: https://www.gov.uk/skilled-worker-visa/knowledge-of-english
      - id: gb-sw-sponsor
        kind: other
        title: Job with a licensed sponsor
        description: The employer must hold a sponsor licence.
        status: draft
        sources:
          - title: Skilled Worker visa
            url: https://www.gov.uk/skilled-worker-visa
  - id: gb-student
    name: Student visa
    purpose: study
    status: draft
    last_verified: null
    summary: For a course with a licensed student sponsor; needs a Confirmation of Acceptance for Studies, English and money for fees and living costs.
    i18n:
      ur:
        name: اسٹوڈنٹ ویزا
        summary: لائسنس یافتہ اسٹوڈنٹ اسپانسر کے کورس کے لیے۔ اس میں CAS، انگریزی کا ثبوت، اور فیس اور رہن سہن کے خرچ کے پیسے درکار ہیں۔
        documents:
          - پاسپورٹ
          - CAS کا حوالہ نمبر
          - انگریزی کا ثبوت
          - پیسوں کا ثبوت
          - ٹی بی ٹیسٹ کا نتیجہ، اگر آپ کے ملک کے لیے ضروری ہو
        interview_topics:
          - آپ نے یہ کورس اور یہ یونیورسٹی کیوں چنی
          - آپ اپنی فیس اور رہن سہن کا خرچ کیسے ادا کریں گے
          - آپ نے پہلے کیا پڑھا اور یہ کورس اس سے کیسے جڑتا ہے
          - کورس کے بعد آپ کا کیا ارادہ ہے
    sources:
      - title: Student visa
        url: https://www.gov.uk/student-visa
    steps:
      - order: 1
        id: offer
        title: Get an unconditional offer
        description: From a university or college that is a licensed student sponsor.
        who: worker
        official_url: https://www.gov.uk/student-visa
        i18n:
          ur:
            title: غیر مشروط آفر حاصل کریں
            description: ایسی یونیورسٹی یا کالج سے جو لائسنس یافتہ اسٹوڈنٹ اسپانسر ہو۔
      - order: 2
        id: cas
        title: Your university sends your CAS
        description: After it accepts you, the university gives you a Confirmation of Acceptance for Studies (CAS) reference. You need it to apply.
        who: university
        i18n:
          ur:
            title: یونیورسٹی آپ کو CAS بھیجتی ہے
            description: داخلہ دینے کے بعد یونیورسٹی آپ کو CAS کا حوالہ نمبر دیتی ہے۔ درخواست کے لیے یہ ضروری ہے۔
      - order: 3
        id: english
        title: Prove your English
        description: The level depends on the course. Check the official page and ask your university.
        who: worker
        official_url: https://www.gov.uk/student-visa
        i18n:
          ur:
            title: انگریزی کا ثبوت دیں
            description: درکار لیول کورس پر منحصر ہے۔ سرکاری صفحہ دیکھیں اور اپنی یونیورسٹی سے پوچھیں۔
      - order: 4
        id: funds
        title: Show you have the money
        description: You need money for your fees and living costs, as set out on the official page.
        who: worker
        official_url: https://www.gov.uk/student-visa
        i18n:
          ur:
            title: پیسوں کا ثبوت دیں
            description: فیس اور رہن سہن کے خرچ کے پیسے درکار ہیں، جیسا سرکاری صفحے پر لکھا ہے۔
      - order: 5
        id: tb-test
        title: Take a TB test, if your country needs one
        description: A tuberculosis test result is needed for some countries. Check the official page for yours.
        who: worker
        # TODO(source): official TB test page and whether it applies to each origin country
        i18n:
          ur:
            title: ٹی بی ٹیسٹ کروائیں، اگر آپ کے ملک کے لیے ضروری ہو
            description: کچھ ممالک کے لیے ٹی بی ٹیسٹ کا نتیجہ ضروری ہے۔ اپنے ملک کے لیے سرکاری صفحہ دیکھیں۔
      - order: 6
        id: apply
        title: Apply online
        description: Pay the fee and healthcare surcharge, then give biometrics.
        who: worker
        official_url: https://www.gov.uk/student-visa
        i18n:
          ur:
            title: آن لائن درخواست دیں
            description: فیس اور ہیلتھ کیئر سرچارج ادا کریں، پھر بائیومیٹرکس دیں۔
    documents:
      - Passport
      - CAS reference
      - English evidence
      - Proof of funds
      - Tuberculosis test result if required for your country
    document_ids: [passport, cas, english-test, proof-of-funds, tb-test]
    # No amounts yet: a number needs its official source and date, or the pack will not load.
    fees:
      - id: visa-application
        item: Visa application fee
        i18n:
          ur:
            item: ویزا درخواست کی فیس
      - id: healthcare-surcharge
        item: Healthcare surcharge
        i18n:
          ur:
            item: ہیلتھ کیئر سرچارج
      - id: english-test
        item: English test
        i18n:
          ur:
            item: انگریزی کا ٹیسٹ
      - id: tb-test
        item: TB test, if your country needs one
        i18n:
          ur:
            item: ٹی بی ٹیسٹ، اگر آپ کے ملک کے لیے ضروری ہو
    # Practice subjects for the credibility interview. General coaching prompts, not rules.
    # TODO(review): check against what the university and the official guidance say.
    interview_topics:
      - Why you chose this course and this university
      - How you will pay your fees and living costs
      - What you studied before and how this course follows from it
      - What you plan to do after the course
    requirements:
      - id: gb-student-english
        kind: language_test
        title: English at the required level
        description: The level depends on the course; check gov.uk and your university.
        status: draft
        sources:
          - title: Student visa
            url: https://www.gov.uk/student-visa
        i18n:
          ur:
            title: مطلوبہ لیول کی انگریزی
            description: لیول کورس پر منحصر ہے؛ gov.uk اور اپنی یونیورسٹی سے معلوم کریں۔

