# Pakistan origin pack.
# STATUS: draft. Every line must be checked against the linked official page before a public launch.
#
# How to verify an item: read the official page, fix the English (and the Urdu under i18n.ur beside
# it), add the page under `sources`, set `last_verified: YYYY-MM-DD` and `status: verified`.
# Never fill a fee, office, phone number, link or rule from memory. An empty field makes the app say
# "not added yet", which is safe. A wrong one can cost a worker their savings.
# Lines marked TODO(source) are waiting for someone to read the official page.
code: PK
name: Pakistan
kind: origin
languages: [ur, en, pa, ps, sd]
currency: PKR
status: draft
last_verified: null
regulator: Bureau of Emigration & Overseas Employment (Ministry of Overseas Pakistanis & HRD)
i18n:
  ur:
    name: پاکستان
    regulator: بیورو آف امیگریشن اینڈ اوورسیز ایمپلائمنٹ (وزارت سمندر پار پاکستانیز و ترقی انسانی وسائل)
official_sources:
  - title: Bureau of Emigration & Overseas Employment
    url: https://beoe.gov.pk
  - title: Overseas Pakistanis Foundation
    url: https://opf.org.pk
  - title: Overseas Employment Corporation (government recruiter, incl. Korea EPS)
    url: https://www.oec.gov.pk
# A link is only accepted when its domain is on one of these lists (see app/packs/__init__.py).
# Add a domain here only after checking it is the real official site.
official_domains: [beoe.gov.pk, opf.org.pk, oec.gov.pk, dgip.gov.pk, nadra.gov.pk, hec.gov.pk, mofa.gov.pk, ibcc.edu.pk]
# Leave null until the current figure is copied from the official source. The rules engine then says
# "verify the official fee" instead of guessing. TODO(source): the legal maximum a licensed promoter may charge.
max_recruitment_fee: null
max_recruitment_fee_source: null

