# `purposes` says who an item is for. These steps are the emigration process for people going abroad
# for a job; they are not shown to students. TODO(source): confirm which apply to other visa types.
departure_checklist:
  - id: licensed-recruiter
    title: Use only a licensed Overseas Employment Promoter
    description: Check the promoter's licence on the Bureau's website before paying anything, and ask for a written receipt for every payment.
    official_url: https://beoe.gov.pk
    purposes: [work, seasonal]
    i18n:
      ur:
        title: صرف لائسنس یافتہ اوورسیز ایمپلائمنٹ پروموٹر کے ذریعے جائیں
        description: کوئی بھی پیسہ دینے سے پہلے بیورو کی ویب سائٹ پر پروموٹر کا لائسنس چیک کریں، اور ہر ادائیگی کی تحریری رسید مانگیں۔
  - id: written-contract
    title: Get a written contract you understand
    description: Read the salary, hours, accommodation, food, medical cover and return ticket terms before you sign. Ask for a copy.
    purposes: [work, seasonal]
    i18n:
      ur:
        title: ایسا تحریری کنٹریکٹ لیں جو آپ کو سمجھ آئے
        description: دستخط سے پہلے تنخواہ، کام کے گھنٹے، رہائش، کھانا، علاج اور واپسی کے ٹکٹ کی شرائط پڑھ لیں۔ ایک کاپی مانگیں۔
  - id: protector-registration
    title: Register with the Protector of Emigrants
    description: Emigrants are processed at a Protector of Emigrants office before departure. Do not travel for work on a visit visa.
    official_url: https://beoe.gov.pk
    document_id: protector-registration
    purposes: [work, seasonal]
    i18n:
      ur:
        title: پروٹیکٹر آف امیگرنٹس کے پاس اندراج کروائیں
        description: باہر جانے والوں کا اندراج روانگی سے پہلے پروٹیکٹر آف امیگرنٹس کے دفتر میں ہوتا ہے۔ وزٹ ویزے پر کام کے لیے سفر نہ کریں۔
  - id: emigrant-insurance
    title: Emigrant insurance
    description: Insurance through the State Life Emigrants Insurance Fund is part of the Bureau's emigration process.
    official_url: https://beoe.gov.pk
    purposes: [work, seasonal]
    i18n:
      ur:
        title: امیگرنٹ انشورنس
        description: اسٹیٹ لائف امیگرنٹس انشورنس فنڈ کی انشورنس بیورو کے امیگریشن کے عمل کا حصہ ہے۔
  - id: briefing
    title: Pre-departure briefing
    description: Attend the briefing; it covers your rights and who to contact abroad.
    official_url: https://beoe.gov.pk
    purposes: [work, seasonal]
    i18n:
      ur:
        title: روانگی سے پہلے کی بریفنگ
        description: بریفنگ میں ضرور جائیں۔ اس میں آپ کے حقوق اور یہ بتایا جاتا ہے کہ باہر کس سے رابطہ کرنا ہے۔
  - id: family-copies
    title: Leave copies with your family
    description: Keep copies of your passport, visa, contract and receipts in the Pardes Guard vault and share them with a family member.
    i18n:
      ur:
        title: کاپیاں اپنے گھر والوں کے پاس چھوڑیں
        description: اپنے پاسپورٹ، ویزے، کنٹریکٹ اور رسیدوں کی کاپیاں پردیس گارڈ کی تجوری میں رکھیں اور گھر کے کسی فرد سے شیئر کریں۔
complaint_channels:
  - name: Bureau of Emigration & Overseas Employment (complaints against promoters)
    url: https://beoe.gov.pk
    i18n:
      ur:
        name: بیورو آف امیگریشن اینڈ اوورسیز ایمپلائمنٹ (پروموٹرز کے خلاف شکایات)
  - name: Overseas Pakistanis Foundation
    url: https://opf.org.pk
    i18n:
      ur:
        name: اوورسیز پاکستانیز فاؤنڈیشن
  - name: National Cyber Crime Investigation Agency (fake job adverts and online recruitment fraud)
    description: Report fake job adverts and online recruitment scams.
    i18n:
      ur:
        name: نیشنل سائبر کرائم انویسٹی گیشن ایجنسی (جعلی نوکریوں کے اشتہار اور آن لائن بھرتی کا فراڈ)
        description: جعلی نوکریوں کے اشتہار اور آن لائن بھرتی کے فراڈ کی رپورٹ کریں۔
ladder_days: [0, 7, 14]
