# United Arab Emirates destination pack. STATUS: draft, verify before launch.
code: AE
name: United Arab Emirates
kind: destination
languages: [ar, en]
currency: AED
status: draft
last_verified: null
official_sources:
  - title: Ministry of Human Resources and Emiratisation (MOHRE)
    url: https://www.mohre.gov.ae
  - title: Federal Authority for Identity, Citizenship, Customs & Port Security (ICP)
    url: https://icp.gov.ae
official_domains: [mohre.gov.ae, icp.gov.ae, u.ae, gdrfad.gov.ae]
red_flag_visa_types: [visit, tourist, transit]
labour_rules:
  status: draft
  passport_retention_prohibited: true
  max_weekly_hours: null
  minimum_monthly_wage: null
  notes:
    - Employers keeping a worker's passport is not allowed in the UAE. Confirm the current rule on the MOHRE site.
    - Private-sector salaries are generally paid through the Wage Protection System, which leaves a record of each payment.
    - The offer letter should be in a language you understand and should match the contract you sign later.
  sources:
    - title: MOHRE
      url: https://www.mohre.gov.ae
visa_routes:
  - id: ae-work
    name: Employment visa and work permit
    purpose: work
    status: draft
    last_verified: null
    summary: The employer gets a work permit and entry permit. After arrival the worker completes a medical test and Emirates ID biometrics, then the residence visa is issued and the contract is registered.
    sources:
      - title: MOHRE
        url: https://www.mohre.gov.ae
      - title: ICP
        url: https://icp.gov.ae
    steps:
      - order: 1
        title: Signed offer letter
        description: Sign an offer letter that states salary, hours and benefits in a language you understand. Keep a copy.
        who: employer
        official_url: https://www.mohre.gov.ae
      - order: 2
        title: Work permit and entry permit
        description: The employer applies for your work permit and entry permit. The permit should be for employment, not a visit.
        who: employer
      - order: 3
        title: Arrive and complete the medical test
        description: After arrival, complete the medical fitness test and Emirates ID biometrics.
        who: worker
        official_url: https://icp.gov.ae
      - order: 4
        title: Residence visa and contract registration
        description: The residence visa is issued and the employment contract is registered. Compare it with your offer letter.
        who: government
        official_url: https://www.mohre.gov.ae
    documents:
      - Passport
      - Signed offer letter
      - Educational certificates, attested if the job needs them
      - Passport photos
    requirements:
      - id: ae-medical
        kind: medical
        title: Medical fitness test after arrival
        description: Part of getting the residence visa.
        status: draft
        sources:
          - title: ICP
            url: https://icp.gov.ae
      - id: ae-offer-letter
        kind: other
        title: Offer letter before the work permit
        description: The offer letter you sign should match the contract registered later.
        status: draft
        sources:
          - title: MOHRE
            url: https://www.mohre.gov.ae
ladder_days: [0, 7, 14]
